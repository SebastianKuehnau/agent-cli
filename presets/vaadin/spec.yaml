# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: __PROJECT__ Vaadin dev environment
description: >-
  JDK 25, Vaadin skills and MCP, Maven/Vaadin/GitHub network access, and
  Playwright browsers.

# __PROJECT__ is set by `task-agent --init vaadin`. Cosmetic: only shows in `sbx kit inspect`.
#
# Schema v3 (sbx v0.51.0+, issue #43). The first line is load-bearing: without it
# sbx parses this file as a Dockerfile. This kit is composed with the claude
# workload (docker.io/sbx/claude, Debian 13), which ships Python, Docker, sudo,
# jq, git and curl — but no JDK and no Node; both are installed below.
#
# Install hooks see only PATH, HOME and a few shell basics; any other variable
# must be listed in the hook's `env:`. The install phase has its own network
# allowlist, closed before the agent starts.

# v3 has no `environment:` block; a container variable is an arg with `env:`.
args:
  # A symlink, not the versioned dir, which names both JDK version and CPU
  # architecture. The install hook below creates it.
  javaHome:
    default: /usr/lib/jvm/default-java
    description: JAVA_HOME inside the sandbox
    env: JAVA_HOME

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # Open only while the install hooks run.
      install:
        allow:
          # apt: the two sources the claude image configures.
          - deb.debian.org
          - dhi.io

          # Claude plugin marketplace and install.
          - github.com
          - codeload.github.com
          - raw.githubusercontent.com

          # npx fetching Playwright, and the browsers it downloads. Chromium itself
          # comes from Chrome for Testing on storage.googleapis.com — a broad host,
          # which is why it is allowed for the install phase only.
          - registry.npmjs.org
          - cdn.playwright.dev
          - playwright.download.prss.microsoft.com
          - storage.googleapis.com

      runtime:
        allow:
          # Maven. No `mvn` in the image; the wrapper downloads it from here.
          - repo.maven.apache.org
          - repo1.maven.org
          - central.sonatype.com

          # Claude plugin marketplace and install.
          - github.com
          - codeload.github.com
          - raw.githubusercontent.com

          # Vaadin docs, MCP, Javadoc.
          - vaadin.com
          - mcp.vaadin.com
          - www.javadocs.dev

          # Playwright browsers: primary host plus the installer's fallback.
          - cdn.playwright.dev
          - playwright.download.prss.microsoft.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Claude Code is baked into the workload image, and nothing in the
        # sandbox ever updates it — an image a few weeks old means an agent a
        # few weeks old (issue #19). This brings it to the current release when
        # the sandbox is built.
        #
        # `|| true` on purpose: an update that cannot reach the network must not
        # fail sandbox creation. The version from the image still works, so a
        # best-effort refresh is worth strictly more than a sandbox that refuses
        # to start when you are offline.
        - description: Update Claude Code
          user: "1000"
          command: "claude update || true"

        # The image's ca-certificates-java leaves the JDK's truststore empty until
        # update-ca-certificates runs; without it every Maven download fails with
        # "trustAnchors parameter must be non-empty". `default-jdk` would be 21.
        #
        # Node is here for Playwright's installer only. Vaadin's own frontend build
        # does not use this Node 20: Vaadin 25 wants a newer one and installs it
        # into ~/.vaadin itself.
        - description: Install JDK 25 and Node
          user: "0"
          command: |
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openjdk-25-jdk-headless ca-certificates-java nodejs npm
            update-ca-certificates -f
            ln -sfn "$(ls -d /usr/lib/jvm/java-25-openjdk-*)" /usr/lib/jvm/default-java

        # Brings the Vaadin skills *and* the Vaadin MCP — no `sbx mcp add` needed.
        - description: Install the Vaadin Claude plugin
          user: "1000"
          command: "claude plugin marketplace add vaadin/agent-marketplace && claude plugin install vaadin-skills@vaadin-marketplace"

        # No browsers in the image. The system libraries need root, the browser
        # itself belongs in the agent's ~/.cache — so two steps, as two users.
        # Drop both if the project has no browser tests.
        #
        # HOME=/root is load-bearing: hooks inherit the image's HOME
        # (/home/agent) whatever their user, so without it root's npx writes a
        # root-owned ~/.npm into the agent's home and the next step fails with
        # EACCES.
        - description: Install Playwright's system dependencies
          user: "0"
          command: "HOME=/root npx --yes playwright install-deps chromium"
        - description: Install the Playwright browser
          user: "1000"
          command: "npx --yes playwright install chromium"
