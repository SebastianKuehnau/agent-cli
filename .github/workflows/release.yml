name: Release

# A v* tag pushed by hand. The work is in publish.yml, which prepare-release.yml
# calls too, so a hand-tagged release and a workflow-driven one build and publish
# through exactly the same steps.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
